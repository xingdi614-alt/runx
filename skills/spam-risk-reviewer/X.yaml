skill: spam-risk-reviewer
version: "0.1.0"

catalog:
  kind: skill
  audience: public
  visibility: public
  role: canonical

harness:
  cases:
    - name: low-risk-verified-sender
      runner: review
      inputs:
        campaign_draft:
          from: updates@example.test
          subject: June product update for active teams
          content_digest: sha256:4d967ce1f81bd0d0f6a6f6b8712ad28c6f88bb2b4e8827d2d4e8ac9edcd403b8
          content_summary: Monthly product update for opted-in workspace admins.
        list_metadata:
          size: 1800
          bounce_rate: 0.004
          complaint_rate: 0.0002
          freshness_days: 18
        sender_auth_posture:
          spf_pass: true
          dkim_pass: true
          dmarc_pass: true
          warm_up_days: 45
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed
          reason_code: process_closed
    - name: high-risk-incomplete-auth-poor-list
      runner: review
      inputs:
        campaign_draft:
          from: promo@example.test
          subject: ACT NOW guaranteed free money offer
          content_digest: sha256:66f9c6f0d7015fd0ce45d2954e6ad732a27e74be8320b4f5d5d450a4a76031d2
          content_summary: Promotional blast with pressure language.
        list_metadata:
          size: 50000
          bounce_rate: 0.12
          complaint_rate: 0.004
          freshness_days: 220
        sender_auth_posture:
          spf_pass: true
          dkim_pass: false
          dmarc_pass: true
          warm_up_days: 3
      expect:
        status: sealed
        receipt:
          schema: runx.receipt.v1
          state: sealed
          disposition: closed
          reason_code: process_closed

runners:
  review:
    default: true
    type: cli-tool
    command: node
    args:
      - run.mjs
    timeout_seconds: 30
    sandbox:
      profile: readonly
      cwd_policy: skill-directory
    outputs:
      send_risk_verdict: object
      authentication_signals: object
      list_hygiene_metrics: object
      policy_thresholds: object
      content_risk_flags: array
      needs_human: object
      send_as_dispatch: object
      authority_boundary: object
    inputs:
      campaign_draft:
        type: json
        required: true
        description: campaign_draft{from, subject, content_digest, optional preview_text and content_summary}
      list_metadata:
        type: json
        required: true
        description: list_metadata{size, bounce_rate, complaint_rate, freshness_days or last_validated_at}
      sender_auth_posture:
        type: json
        required: true
        description: sender_auth_posture{spf_pass, dkim_pass, dmarc_pass, warm_up_days}
      policy:
        type: json
        required: false
        description: Optional thresholds for bounce, complaint, freshness, and warm-up days.
